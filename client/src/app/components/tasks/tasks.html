<!-- Навігаційна панель зверху -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-check2-square text-primary me-2"></i>TodoApp Workspace
    </span>
    <div class="d-flex align-items-center text-white">
      <span class="me-3 d-none d-sm-inline"><i class="bi bi-person-circle me-1"></i>{{ userEmail }}</span>
      <button (click)="logout()" class="btn btn-outline-danger btn-sm fw-semibold">
        <i class="bi bi-box-arrow-right me-1"></i>Вийти
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid my-4 px-4">
  <div class="row g-4">

    <!-- ПОМИЛКИ -->
    <div *ngIf="errorMessage" class="col-12">
      <div class="alert alert-danger alert-dismissible fade show p-3 text-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
        <button type="button" class="btn-close" (click)="errorMessage = null"></button>
      </div>
    </div>

    <!-- ЛІВА ПАНЕЛЬ: КАТЕГОРІЇ -->
    <div class="col-lg-3 col-md-4">
      <div class="card p-3 shadow-sm" style="border-radius: 10px;">
        <h5 class="fw-bold mb-3"><i class="bi bi-tags-fill text-primary me-2"></i>Категорії</h5>

        <!-- Список категорій -->
        <div class="list-group mb-3">
          <!-- "Всі завдання" -->
          <button (click)="filterByCategory('')"
                  [class.active]="query.categoryId === ''"
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="bi bi-grid-1x2 me-2"></i>Всі завдання</span>
          </button>

          <!-- Кастомні категорії користувача -->
          <button *ngFor="let cat of categories"
                  (click)="filterByCategory(cat.id)"
                  [class.active]="query.categoryId === cat.id"
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="bi bi-tag me-2"></i>{{ cat.name }}</span>
            <span (click)="deleteCategory(cat.id, $event)" class="text-danger-hover">
              <i class="bi bi-trash"></i>
            </span>
          </button>
        </div>

        <!-- Форма створення нової категорії -->
        <form (ngSubmit)="createCategory()" #catForm="ngForm" class="mt-2">
          <div class="input-group">
            <input type="text" name="catName" class="form-control form-control-sm"
                   placeholder="Нова категорія..." required [(ngModel)]="newCategory.name">
            <button type="submit" class="btn btn-primary btn-sm" [disabled]="!catForm.form.valid">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ПРАВА ПАНЕЛЬ: ЗАВДАННЯ -->
    <div class="col-lg-9 col-md-8">

      <!-- Форма швидкого створення таски -->
      <div class="card p-3 shadow-sm mb-4" style="border-radius: 10px;">
        <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle-fill text-success me-2"></i>Нове завдання</h5>
        <form (ngSubmit)="createTask()" #taskForm="ngForm">
          <div class="row g-2">
            <!-- Назва -->
            <div class="col-md-6">
              <input type="text" name="title" class="form-control" placeholder="Що потрібно зробити?" required [(ngModel)]="newTask.title">
            </div>
            <!-- Опис -->
            <div class="col-md-6">
              <input type="text" name="description" class="form-control" placeholder="Опис (опціонально)..." [(ngModel)]="newTask.description">
            </div>
            <!-- Дата виконання -->
            <div class="col-md-4">
              <input type="date" name="dueDate" class="form-control" [(ngModel)]="newTask.dueDate">
            </div>
            <!-- Обрати категорію -->
            <div class="col-md-4">
              <select name="categoryId" class="form-select" [(ngModel)]="newTask.categoryId">
                <option value="">Без категорії</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
              </select>
            </div>
            <!-- Кнопка створення -->
            <div class="col-md-4">
              <button type="submit" class="btn btn-success w-100 fw-semibold" [disabled]="!taskForm.form.valid">
                <i class="bi bi-plus-lg me-1"></i>Додати завдання
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- СПИСОК ЗАВДАНЬ -->
      <div class="card p-3 shadow-sm" style="border-radius: 10px;">

        <!-- Панель пошуку -->
        <div class="d-flex mb-3">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" [(ngModel)]="query.searchTerm" (input)="onSearch()" class="form-control" placeholder="Пошук завдань за назвою або описом...">
          </div>
        </div>

        <!-- Перелік тасок -->
        <div *ngIf="tasks.length === 0" class="text-center py-5 text-muted">
          <i class="bi bi-journal-x" style="font-size: 3rem;"></i>
          <p class="mt-2 fw-semibold">Завдань не знайдено</p>
        </div>

        <div *ngIf="tasks.length > 0" class="list-group list-group-flush mb-3">
          <div *ngFor="let task of tasks" class="list-group-item py-3 px-1 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
              <!-- Чекбокс статусу виконання -->
              <input type="checkbox" [checked]="task.isCompleted" (change)="toggleComplete(task)" class="form-check-input me-3" style="width: 1.3rem; height: 1.3rem; cursor: pointer;">
              <div>
                <span [class.text-decoration-line-through]="task.isCompleted" [class.text-muted]="task.isCompleted" class="fw-bold fs-5">
                  {{ task.title }}
                </span>
                <p *ngIf="task.description" class="text-muted mb-0 small">{{ task.description }}</p>
                <!-- Бейджики для дати та категорії -->
                <div class="mt-1">
                  <span *ngIf="task.category" class="badge bg-primary me-2"><i class="bi bi-tag me-1"></i>{{ task.category.name }}</span>
                  <span *ngIf="task.dueDate" class="badge bg-secondary"><i class="bi bi-calendar me-1"></i>До: {{ task.dueDate | date:'dd.MM.yyyy' }}</span>
                </div>
              </div>
            </div>
            <!-- Видалення -->
            <button (click)="deleteTask(task.id)" class="btn btn-outline-danger btn-sm border-0">
              <i class="bi bi-trash-fill fs-5"></i>
            </button>
          </div>
        </div>

        <!-- ПАНЕЛЬ ПАГІНАЦІЇ (У самому низу) -->
        <div *ngIf="tasks.length > 0" class="d-flex flex-wrap justify-content-between align-items-center pt-3 border-top">
          <!-- Вибір кількості елементів на сторінці -->
          <div class="d-flex align-items-center mb-2 mb-sm-0">
            <span class="text-muted me-2 small">Показувати по:</span>
            <select [ngModel]="query.pageSize" (ngModelChange)="changePageSize($event)" class="form-select form-select-sm" style="width: auto;">
              <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
            </select>
          </div>

          <!-- Навігація між сторінками -->
          <div class="d-flex align-items-center">
            <span class="text-muted small me-3">Всього знайдено: <strong>{{ totalCount }}</strong></span>
            <button (click)="prevPage()" [disabled]="query.pageNumber === 1" class="btn btn-outline-secondary btn-sm me-1">
              <i class="bi bi-chevron-left"></i>
            </button>
            <span class="mx-2 fw-semibold small">Сторінка {{ query.pageNumber }}</span>
            <button (click)="nextPage()" [disabled]="query.pageNumber * query.pageSize >= totalCount" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
