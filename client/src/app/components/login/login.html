<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px; border-radius: 12px;">

    <div class="text-center mb-4">
      <i class="bi bi-check2-square text-primary" style="font-size: 3rem;"></i>
      <h2 class="mt-2 fw-bold">Вхід у TodoApp</h2>
      <p class="text-muted">Керуйте своїми завданнями легко</p>
    </div>

    <!-- Повідомлення про помилку -->
    <div *ngIf="errorMessage" class="alert alert-danger p-2 text-center" role="alert" style="font-size: 0.9rem;">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email адреса</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="name@example.com" required [(ngModel)]="loginData.email" #email="ngModel">
        </div>
      </div>

      <!-- Пароль -->
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required [(ngModel)]="loginData.password" #password="ngModel">
        </div>
      </div>

      <!-- Кнопка входу -->
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" [disabled]="!loginForm.form.valid">
        Увійти
      </button>
    </form>

    <div class="text-center mt-4">
      <span class="text-muted">Немає акаунту?</span>
      <a routerLink="/register" class="text-primary fw-semibold text-decoration-none ms-1">Зареєструватися</a>
    </div>

  </div>
</div>
